
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MANEE Shop | ร้านค้าเกม</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      background: #1b1b1b;
      padding: 20px;
      border-bottom: 2px solid #e32636;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      color: #ff3030;
      font-size: 25px;
      font-weight: bold;
    }
    button {
      background: #e32636;
      border: 0;
      color: white;
      padding: 11px 17px;
      border-radius: 7px;
      cursor: pointer;
    }
    .hero {
      text-align: center;
      padding: 55px 15px;
      background: linear-gradient(135deg,#310808,#151515);
    }
    .hero h1 { font-size: 34px; }
    .hero span { color: #ff3030; }
    .container { padding: 20px; max-width: 1100px; margin: auto; }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
      gap: 18px;
    }
    .card {
      background: #202020;
      border: 1px solid #383838;
      border-radius: 12px;
      padding: 15px;
    }
    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      background: #333;
    }
    .price { color: #ff4545; font-size: 20px; font-weight: bold; }
    .empty { color: #aaa; text-align: center; padding: 30px; }
    footer {
      text-align: center;
      padding: 25px;
      color: #888;
      border-top: 1px solid #333;
      margin-top: 40px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">MANEE SHOP</div>
  <button onclick="alert('ระบบสมาชิกกำลังเตรียมเปิดใช้งาน')">
    เข้าสู่ระบบ
  </button>
</header>

<section class="hero">
  <h1>ยินดีต้อนรับสู่ <span>MANEE SHOP</span></h1>
  <p>ร้านค้าเกม ซื้อขายง่าย สะดวก รวดเร็ว</p>
  <button onclick="document.getElementById('shop').scrollIntoView()">
    เลือกซื้อสินค้า
  </button>
</section>

<main class="container" id="shop">
  <h2>สินค้าแนะนำ</h2>
  <div class="products" id="products">
    <p class="empty">กำลังเตรียมระบบสินค้า...</p>
  </div>
</main>

<footer>
  © 2026 MANEE Shop
  <p>ร้านค้าเกมออนไลน์</p>
</footer>

</body>
</html>
