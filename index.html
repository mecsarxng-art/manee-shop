
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MANEE Shop - ร้านค้าเกม</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>

<body>

<header>
  <div class="logo">MANEE <span>SHOP</span></div>

  <nav>
    <a href="#home">หน้าหลัก</a>
    <a href="#shop">สินค้า</a>
    <a href="#contact">ติดต่อเรา</a>
  </nav>
</header>

<section class="hero" id="home">
  <div class="hero-content">
    <h1>WELCOME TO <span>MANEE SHOP</span></h1>
    <p>ร้านค้าเกมออนไลน์ ซื้อขายง่าย สะดวก รวดเร็ว</p>
    <a href="#shop" class="main-button">เลือกซื้อสินค้า</a>
  </div>
</section>

<main class="container" id="shop">

  <h2>สินค้า<span>ทั้งหมด</span></h2>
  <p class="subtitle">เลือกสินค้าที่คุณต้องการ</p>

  <div class="products" id="products">
    <p class="empty">กำลังโหลดสินค้า...</p>
  </div>

</main>

<section class="contact" id="contact">
  <h2>MANEE SHOP</h2>
  <p>ขอบคุณที่ใช้บริการร้านค้าของเรา</p>
</section>

<footer>
  © 2026 MANEE Shop. All Rights Reserved.
</footer>

</body>
</html>
